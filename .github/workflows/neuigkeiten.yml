# Holt Neuigkeiten und abgeschlossene Projekte aus SharePoint und veröffentlicht sie direkt.
# Die Freigabe passiert in SharePoint:
#   - Neuigkeiten: Spalte "Webseite: freigegeben" = Ja
#   - Unsere letzten Projekte: Projektstatus "Abgeschlossen" und Veröffentlichung "Öffentlich"
name: Neuigkeiten aus SharePoint

on:
  schedule:
    - cron: "23 5-20 * * *"   # stündlich zwischen etwa 6 und 22 Uhr
  workflow_dispatch:           # Knopf "Run workflow" unter Actions
  repository_dispatch:         # Auslöser aus Power Automate (optional)
    types: [sharepoint]

permissions:
  contents: write
  pages: write

concurrency:
  group: neuigkeiten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bildwerkzeug installieren
        run: pip install pillow==11.0.0

      - name: Daten aus SharePoint holen
        run: python scripts/neuigkeiten.py
        env:
          TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}

      - name: Veröffentlichen
        id: veroeffentlichen
        run: |
          git add -A index.html img/auto
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            echo "geaendert=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="Neuigkeiten aus SharePoint" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Neuigkeiten aus SharePoint aktualisiert"
          git push
          echo "geaendert=ja" >> "$GITHUB_OUTPUT"

      - name: Webseite neu bauen
        if: steps.veroeffentlichen.outputs.geaendert == 'ja'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
